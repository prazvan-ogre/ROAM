name: CI

on:
  pull_request:
    branches: [main, develop]
  push:
    branches: [main, develop]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Typecheck
        run: npm run typecheck

      - name: Build
        run: npm run build
        env:
          # Dummy values so `next build` can statically render pages that
          # touch env vars. No real Supabase call happens during build.
          NEXT_PUBLIC_SUPABASE_URL: https://placeholder.supabase.co
          NEXT_PUBLIC_SUPABASE_ANON_KEY: placeholder-anon-key
          NEXT_PUBLIC_APP_ENV: ci
          NEXT_PUBLIC_ACTIVE_TRIP_SLUG: kassandra-2026

  battle-scoring-tests:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      PGHOST: localhost
      PGPORT: 5432
      PGUSER: postgres
      PGPASSWORD: postgres
      PGDATABASE: postgres
    steps:
      - uses: actions/checkout@v4

      # A bare postgres:16 image has none of what a real Supabase project
      # provisions (anon/authenticated roles, the auth schema, the
      # supabase_realtime publication) -- without this, migrations that
      # grant to anon/authenticated or reference auth.uid()/auth.users
      # fail outright and ON_ERROR_STOP=1 aborts the whole sequence before
      # any later migration (including the ones the tests below actually
      # exercise) ever applies. See supabase/ci-bootstrap.sql for exactly
      # what this does and does not cover -- it is NOT a full Supabase
      # Auth/RLS emulation, only enough for every migration to apply and
      # for the SQL regression tests below (which run as the postgres
      # superuser, so RLS enforcement itself is not what they check) to
      # run against a fully-migrated schema.
      - name: Bootstrap Supabase-only roles/schema/publication (not a full Auth/RLS emulation)
        run: psql -v ON_ERROR_STOP=1 -f supabase/ci-bootstrap.sql

      - name: Apply migrations
        run: |
          for f in supabase/migrations/*.sql; do
            echo "Applying $f"
            psql -v ON_ERROR_STOP=1 -f "$f"
          done

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      # Regression: must always pass. A non-zero exit here is always a
      # real failure -- no wrapper, no swallowed exit code.
      #
      # test:sql:fractional (hypothesis C/R3) and test:sql:completion
      # (hypothesis D/R2) were both deliberately-red reproductions until
      # 20260906110000_fix_battle_score_fractional_average.sql and the
      # active-profile scoping in app/trip/[slug]/page.tsx fixed their
      # underlying bugs; both supabase/tests/*.test.sql files were
      # converted in the same batch as each fix to assert the now-correct
      # behavior instead of reproducing the wrong one, so both belong
      # here now, alongside the always-must-pass test:sql, not in a
      # known-bug wrapper. If a future hypothesis needs one of those
      # again, follow the pattern this replaced: assert the *exact*
      # expected failure (exit code AND message), not just "any non-zero
      # exit", so a real setup/migration/connection problem is never
      # mistaken for the known bug.
      - name: Run battle scoring regression tests
        run: |
          npm run test:sql
          npm run test:sql:fractional
          npm run test:sql:completion

  unit-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      # Unlike the SQL reproductions above, most of these tests currently
      # PASS *because* the bug they cover is still present -- they assert
      # today's actual (buggy) behavior at a real code boundary (see each
      # file's own header comment for which lib/route it exercises):
      #   - tests/unit/api-account-ownership.test.ts
      #   - tests/unit/battle-score-divergence.test.ts
      #   - tests/unit/trips-page-link-on-existing-login.test.tsx
      # When the batch that fixes one of those defects lands, update that
      # file's assertions to expect the corrected behavior as part of the
      # same commit -- don't leave it asserting removed behavior.
      #
      # tests/unit/active-profile-switch-submission-identity.test.tsx is
      # the opposite shape, matching the SQL scripts above instead: its
      # second test uses vitest's it.fails() to assert a newly-confirmed,
      # still-unfixed defect (switching the active profile after a
      # question is already open doesn't change who it submits as). See
      # that file's header for the exact contract; when fixed, it.fails()
      # itself will start failing ("Expect test to fail") -- that is the
      # signal to convert it to a plain `it` in the same batch.
      #
      # No wrapper needed here (unlike the SQL steps above): vitest's own
      # exit code already does the right thing for both shapes -- 0 when
      # every test (including every it.fails()) behaves as currently
      # contracted, non-zero the moment any of them doesn't.
      - name: Run Vitest unit/component tests
        run: npm test
